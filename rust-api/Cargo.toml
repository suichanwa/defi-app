[package]
name = "rust-api"
version = "0.1.0"
edition = "2021"
authors = ["suiseika"]

[lib]
name = "rust_wallet_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
aes = "0.8"
ctr = "0.9"
pbkdf2 = "0.12"
sha2 = "0.10"
hex = "0.4"
jni = "0.21"
rand = "0.8"
serde = { version = "1.0.213", features = ["derive"] }
serde_json = "1.0.132"
