[package]
name = "rust-wallet-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_wallet_core"
crate-type = ["cdylib"]

[dependencies]
aes = "0.8"
ctr = "0.9"
pbkdf2 = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
jni = "0.21"
rand = "0.8"

